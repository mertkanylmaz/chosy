# K-42 Senaryo 1 — Soğuk başlangıç, tam offline (fresh install, cache yok)
#
# Beklenen: `generate-gauntlet` yanıtı hiç gelmez (ağ yok) VE yerel cache
# de yok (clearState: true → AsyncStorage boş) → GauntletShell doğrudan
# hata ekranına düşer (gauntletCache.readCachedGauntlet → null →
# GauntletShell/index.tsx loadError dalı). Kontrol edilen şey "beyaz ekran
# / boş state asla" (K-42) — kullanıcı MUTLAKA görünür bir hata + "Tekrar
# Dene" görür, sessiz/boş bir yüzeyle karşılaşmaz.
#
# ÖN KOŞUL — cihaz saati 18:00 sonrası olmalı: bu build release-mode JS
# bundle çalıştırır (__DEV__ === false), UNLOCK_HOUR kapısı gerçek saate
# bakar (GauntletShell/index.tsx:84,109-114). 18:00'den önce çalıştırılırsa
# ekran "before_18" metnini gösterir ve bu flow'un asıl test ettiği offline
# hata yolu hiç değerlendirilmez — sonuç yorumlanamaz hale gelir (bkz.
# E-11, 31 Ağu 2026, aynı kör nokta).
#
# SADECE ANDROID: setAirplaneMode iOS simülatöründe hiç etkisi yok, gerçek
# iOS cihazda da komut geçer ama network durumunu değiştirmez (Maestro'nun
# resmi kısıtı). iOS'ta bu senaryo hâlâ manuel test gerektirir — bkz.
# docs/testing/MAESTRO.md.
appId: com.chosy.ai
---
- setAirplaneMode: enabled
- launchApp:
    clearState: true
- assertVisible: "Today's films couldn't load. Try again."
- assertVisible: "Try again"
- assertNotVisible: "Which one tonight?"
- setAirplaneMode: disabled
