# ============================================================================
# Supabase CLI yapılandırması — BİLİNÇLİ OLARAK MİNİMAL
#
# Bu dosya tek bir sorun için var: `--no-verify-jwt` yalnızca deploy komutunun
# bayrağıdır, kalıcı bir özellik değil. Bayrak unutulursa fonksiyon JWT
# doğrulaması açık şekilde yeniden deploy edilir, pg_cron'un header'sız çağrısı
# 401 alır ve bu HİÇBİR YERDE GÖRÜNMEZ: pg_net fire-and-forget olduğu için
# `cron.job_run_details` yine `succeeded` yazar. Yani tam olarak 7 Ağu 2026'da
# keşfedilen ölü cron sınıfından bir hata (docs/TEKNIK_BORC.md → "pg_cron
# job'larının çoğu aylardır sessizce ölü"). Beyanın kalıcı olması gerekiyor.
#
# ── Neden başka hiçbir bölüm yok ────────────────────────────────────────────
# `[db]`, `[api]`, `[auth]`, `[storage]` vb. blokları YAZILMADI. Bu dosya
# yokken CLI uzak projenin gerçek ayarlarını kullanıyor; blok eklemek yerel
# varsayılanları "beyan edilmiş gerçek" hâline getirir ve uzak/yerel drift
# riski doğurur. Bu task'ın kapsamı yalnızca verify_jwt beyanıdır.
#
# Yeni bölüm eklemek mimari karardır — CTO onayı ister.
# ============================================================================

# ── Liste neden EKSİKSİZ tutuluyor ──────────────────────────────────────────
# Aşağıdaki her fonksiyon bugün `--no-verify-jwt` ile deploy ediliyor. Beyan
# etmemek mekanik bir regresyon YARATMAZDI (beyansız varsayılan zaten `true`,
# bu dosya olmadan da öyleydi), ama dosyanın kendisi otorite gibi görünüyor:
# birinin buraya bakıp "JWT ayarları beyan edilmiş" diyerek isimsiz toplu
# deploy yapması, beyan dışı kalanları sessizce kırardı. Liste eksiksiz.
#
# Yeni bir Edge Function `--no-verify-jwt` ile deploy edilecekse buraya da
# eklenir. Ekleme yoksa fonksiyon JWT doğrulaması AÇIK çalışır.

# ─── Cron ile tetiklenenler ─────────────────────────────────────────────────
# 9 Ağu 2026 (C.0b) öncesinde bu bölümün açıklaması şuydu: "Çağrı pg_net'ten
# gelir, Authorization header'ı TAŞIMAZ." Artık taşıyor — migration 077 altı
# cron'un komutuna Vault'tan okunan `Bearer` header'ı ekledi ve bu beş
# fonksiyona `requireServiceRole()` kapısı takıldı. Yani doğrulama var, ama
# gateway'de değil fonksiyonun içinde: `verify_jwt = false` bu yüzden ZORUNLU.
#
# ⚠️ `sb_secret_…` bir JWT DEĞİLDİR. `verify_jwt = true` olan bir fonksiyona
# cron'un header'ı gateway'de reddedilir ve istek fonksiyona hiç ulaşmaz —
# fonksiyon içindeki kapı hiç çalışmaz, 401 dışarıdan "yanlış anahtar" gibi
# görünür. Bu bölümdeki bir satırı `true` yapmak cron'u öldürür.
#
# 9 Ağu 2026 ölçümü (`supabase functions list -o json`): send-daily-pick ve
# watchlist-activation sunucuda `verify_jwt = true` idi çünkü bu dosyada
# beyanları YOKTU ve CLI varsayılanı `true`. İkisinin cron'ları o sırada
# `active = false` olduğu için üretimde görünmüyordu; C.2'de açılsalardı
# gateway'de sessizce ölürlerdi. Beyanlar aşağıya eklendi.

[functions.generate-global-slot]
verify_jwt = false

[functions.sync-trending]
verify_jwt = false

[functions.curate-posterle]
verify_jwt = false

[functions.send-daily-pick]
verify_jwt = false

[functions.watchlist-activation]
verify_jwt = false

# ─── Kendi sırrını doğrulayan webhook ───────────────────────────────────────
# RevenueCat Supabase JWT'si GÖNDERMEZ; `Bearer <REVENUECAT_WEBHOOK_SECRET>`
# gönderir ve fonksiyon bunu index.ts:75'te kendisi doğrular. verify_jwt
# açılırsa ödeme webhook'u 401 döner ve RevenueCat retry'ları sessizce tükenir.
# Bu satır pazarlık dışıdır.

[functions.revenuecat-webhook]
verify_jwt = false

# ─── İstemciden çağrılan, auth'unu kendi yapanlar ───────────────────────────
# Beşi de çağıranın kimliğini fonksiyon içinde `auth.getUser` ile doğrular.
# parse-mood ve explain-match bunu `_shared/auth.ts` → `requireUser()` ile
# yapar; slot-* üçlüsü kendi kopyasını taşır.
#
# ⚠️ Bu bölümdeki bir fonksiyona `verify_jwt = true` yapmak KORUMA EKLEMEZ,
# sadece anon key şartı koyar — o key uygulama binary'sinde gömülüdür. Gerçek
# koruma fonksiyonun içindedir; bu satırlar onu devre dışı bırakmak için değil,
# platformun ikinci kez aynı işi yapmasını önlemek için var.

[functions.parse-mood]
verify_jwt = false

[functions.explain-match]
verify_jwt = false

[functions.slot-mood-filtered]
verify_jwt = false

[functions.slot-pure-random]
verify_jwt = false

[functions.slot-triple]
verify_jwt = false

# ─── Elle tetiklenen batch üretimi ──────────────────────────────────────────
# 8 Ağu 2026: bu bölüm eskiden "⚠️ Auth'suz ve ücretli" başlığını taşıyordu ve
# içinde explain-match + generate-puzzles vardı. İkisine de auth eklendi,
# bölüm kapandı.
#
# generate-puzzles'a auth eklenmesi daha önce ertelenmişti çünkü çağıranının
# SQL Editor'den kurulmuş, repoda migration'ı olmayan bir cron olduğu ve hangi
# header'ı gönderdiği bilinmiyordu. `cron.job` listesi doğrulandı: böyle bir
# cron YOK — 7 job'ın hiçbiri generate-puzzles çağırmıyor. Tek çağıran elle
# tetikleme. "Sessiz ölü cron üretme" riski gerçekte mevcut değildi.
#
# Artık fonksiyon içinde `requireServiceRole` var: Bearer token'ı
# SUPABASE_SERVICE_ROLE_KEY ile sabit-zamanlı karşılaştırıyor, eşleşmeyen her
# çağrı 401. verify_jwt = false BİLEREK kalıyor — doğrulama gateway'e değil
# fonksiyona ait, ve anon key şartı koymanın koruma değeri yok (o key
# uygulama binary'sinde gömülü). Gerekçenin tamamı: _shared/auth.ts.

[functions.generate-puzzles]
verify_jwt = false
