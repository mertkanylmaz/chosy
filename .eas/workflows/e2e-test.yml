# K-42 offline E2E — iskelet.
#
# BİLİNÇLİ OLARAK `on:` TETİKLEYİCİSİ YOK. Her push'ta otomatik koşmaz —
# CTO ilk koşumu elle tetikleyecek:
#   eas workflow:run .eas/workflows/e2e-test.yml
# (npm script: `npm run e2e:workflow`)
#
# iOS (DUR NOKTASI onaylı, K-42 Maestro override): `setAirplaneMode`
# iOS'ta hiçbir zaman gerçek network etkisi yaratmıyor (Maestro'nun resmi
# kısıtı) — bu yüzden 4 flow artık OS-seviyesi airplane mode yerine
# `chosy://e2e/set-offline` / `set-online` deep link'lerini kullanıyor
# (`services/networkStatus.ts` + `services/supabase.ts` fetch override).
# Bu mekanizma yalnız `EXPO_PUBLIC_APP_ENV=e2e-test` olduğunda aktif —
# tek doğruluk kaynağı `utils/e2eTestMode.ts`.
#
# Build profili: eas.json → "preview-e2e" (preview-store'dan extends,
# EXPO_PUBLIC_APP_ENV=e2e-test env'i ekler). Bu profilin artık bir submit
# bloğu VAR (TestFlight internal-only, bkz. docs/testing/MAESTRO.md) —
# güvenlik sınırı submit bloğunun yokluğu değil, e2e-test env'inin yalnız
# bu profile hapsedilmiş olmasıdır.
#
# k42-07 (4xx kalıcı ret) aşağıdaki listede BİLEREK yok: Maestro Cloud
# ücretli, o senaryo manuel referans olarak duruyor.
name: k42-offline-e2e

jobs:
  build_ios_e2e:
    type: build
    params:
      platform: ios
      profile: preview-e2e

  maestro_k42:
    needs: [build_ios_e2e]
    type: maestro
    params:
      build_id: ${{ needs.build_ios_e2e.outputs.build_id }}
      flow_path:
        - .maestro/k42-01-cold-start-offline.yaml
        - .maestro/k42-02-cache-today-offline.yaml
        - .maestro/k42-04-offline-selection.yaml
        - .maestro/k42-05-sync-on-reconnect.yaml
