# K-42 Senaryo 1 — Soğuk başlangıç, tam offline (fresh install, cache yok)
#
# Beklenen: `generate-gauntlet` yanıtı hiç gelmez (sahte offline) VE yerel
# cache de yok (clearState: true → AsyncStorage boş) → GauntletShell
# doğrudan hata ekranına düşer. Kontrol edilen şey "beyaz ekran / boş state
# asla" (K-42) — kullanıcı MUTLAKA görünür bir hata + "Tekrar Dene" görür.
#
# iOS OVERRIDE (DUR NOKTASI onaylı, yalnız `preview-e2e` build'i):
# `setAirplaneMode` iOS'ta gerçek network'ü kesmiyor (Maestro'nun resmi
# kısıtı). Bunun yerine `chosy://e2e/set-offline` deep link'i açılıyor —
# `services/networkStatus.ts` bunu yakalayıp `services/supabase.ts`'teki
# fetch override'ını devreye sokuyor (yalnız `EXPO_PUBLIC_APP_ENV=e2e-test`
# olduğunda aktif, bkz. `utils/e2eTestMode.ts`).
#
# SIRA NEDEN BÖYLE: `openLink` custom scheme'i uygulama ÇALIŞMIYORKEN
# açarsa bu bir SOĞUK BAŞLANGIÇ olur ve `Linking.getInitialURL()` ile
# okunur — `resolveIsOnline()` ilk isteği bu kontrol bitmeden GÖNDERMEZ
# (yarış durumu yok). Bu yüzden önce `clearState: true` ile temiz kurulum,
# sonra `stopApp` ile hemen kapatma, sonra `openLink` ile "offline bilgisiyle
# soğuk başlatma" sırası izleniyor.
#
# ⚠️ BİLİNEN KIRILGANLIK: `clearState: true` sonrası uygulama BİR AN için
# gerçek online varsayımıyla açılır (`stopApp`'a kadar). Bu pencerede bir
# `generate-gauntlet` isteği TEORİK olarak tamamlanıp cache yazabilir —
# GauntletShell'in kendi 401 bootstrap penceresi (taze anonim oturumda
# `public.users` satırı henüz hazır olmayabilir, `MAX_AUTH_ATTEMPTS`
# backoff'u) bunu pratikte olası kılmıyor, ama DETERMİNİSTİK DEĞİL. Bu
# flow flaky çıkarsa önce bunu düşünün — GauntletShell/networkStatus'a ek
# müdahale gerekir (kapsam dışı, bkz. docs/testing/MAESTRO.md).
#
# ÖN KOŞUL — cihaz saati 18:00 sonrası GEREKMEZ: `isE2ETestMode()` UNLOCK_HOUR
# kapısını `preview-e2e` build'inde bypass eder (GauntletShell/index.tsx).
appId: com.chosy.ai
---
- launchApp:
    clearState: true
- stopApp
- openLink: "chosy://e2e/set-offline"
- assertVisible: "Today's films couldn't load. Try again."
- assertVisible: "Try again"
- assertNotVisible: "Which one tonight?"
